name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/gofmt-output
          test ! -s /tmp/gofmt-output

      - name: Run tests
        run: go test -race -cover ./...

      - name: Run vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            goos: linux
            goarch: amd64
          - name: Linux ARM64
            goos: linux
            goarch: arm64
          - name: macOS Intel
            goos: darwin
            goarch: amd64
          - name: macOS Apple Silicon
            goos: darwin
            goarch: arm64
          - name: Windows x64
            goos: windows
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/dlr

      - name: Build Windows desktop app
        if: matrix.goos == 'windows'
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-H windowsgui" ./cmd/dlr-gui

  windows-ui:
    name: Validate Windows UI
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check PowerShell syntax and WPF markup
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Resolve-Path "cmd/dlr-gui/ui_windows.ps1"
          [void] [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref] $tokens,
            [ref] $parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }

          Add-Type -AssemblyName PresentationFramework
          $xamlPath = Resolve-Path "cmd/dlr-gui/ui_spectrum.xaml"
          $xaml = Get-Content $xamlPath -Raw
          $window = [Windows.Markup.XamlReader]::Parse($xaml)
          if ($null -eq $window.FindName("DownloadButton")) {
            throw "DownloadButton was not created."
          }
          $window.Close()

      - name: Verify Windows search shortcut
        shell: powershell
        run: |
          $testDirectory = Join-Path $env:RUNNER_TEMP "dlr-start-menu-test"
          New-Item $testDirectory -ItemType Directory -Force | Out-Null
          New-Item (Join-Path $testDirectory "dlr-gui.exe") -ItemType File -Force | Out-Null

          $env:DLR_APP_DIR = $testDirectory
          $env:DLR_START_MENU_DIR = $testDirectory
          $env:DLR_UI_VALIDATE = "1"
          & (Resolve-Path "cmd/dlr-gui/ui_windows.ps1")

          $shortcutPath = Join-Path $testDirectory "DLR.lnk"
          if (-not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) {
            throw "DLR.lnk was not created."
          }

          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          $expectedTarget = Join-Path $testDirectory "dlr-gui.exe"
          if ($shortcut.TargetPath -ne $expectedTarget) {
            throw "Shortcut target is '$($shortcut.TargetPath)', expected '$expectedTarget'."
          }

      - name: Test and build Windows app
        run: |
          go test ./cmd/dlr-gui
          go build -trimpath -ldflags "-H windowsgui" ./cmd/dlr-gui
